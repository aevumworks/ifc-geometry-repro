name: Reproduce IFC geometry
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install uv==0.12.17
      - run: npm ci
      - run: uv sync --locked --python 3.13
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python -m ifc_repro replay fixtures/schependomlaan
